name: lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntaxe bash
        run: for f in ct/*.sh install/*.sh tools/*.sh; do bash -n "$f"; done
      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning ct/*.sh install/*.sh tools/*.sh
      - name: JSON du tableau de bord
        run: python3 -m json.tool tools/grafana/homelab-logs.json > /dev/null
